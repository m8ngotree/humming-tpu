[project]
name = "humming-tpu"
version = "0.0.1"
description = "Quantized GEMM kernels for TPU (Pallas), inspired by vllm-project/humming"
requires-python = ">=3.12"
dependencies = [
    "jax==0.11.2",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humming_tpu"]
